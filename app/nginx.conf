server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The API lives in the sibling container; one hostname serves both.
    location /api/ {
        proxy_pass http://snapclaim-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 24m;
    }
    location = /health { proxy_pass http://snapclaim-api:8080; }
    location = /health/db { proxy_pass http://snapclaim-api:8080; }

    location /_expo/ { expires 30d; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri.html $uri/ /index.html; }
}
