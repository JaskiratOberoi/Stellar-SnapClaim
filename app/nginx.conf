server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    types { application/manifest+json webmanifest; }
    include /etc/nginx/mime.types;

    # The API lives in the sibling container; one hostname serves both.
    location /api/ {
        proxy_pass http://snapclaim-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        client_max_body_size 24m;
    }
    location = /health { proxy_pass http://snapclaim-api:8080; }
    location = /health/db { proxy_pass http://snapclaim-api:8080; }

    # Hashed bundles live forever; a missing one is a 404, never the HTML shell.
    location /_expo/ { try_files $uri =404; expires 30d; add_header Cache-Control "public, immutable"; }
    # The service worker must never be cached, by the browser or the CDN edge, or the Update button would lag a deploy.
    location = /sw.js { add_header Cache-Control "no-store"; }
    # Pages revalidate on every load, so a redeploy is picked up without a hard refresh.
    location / { try_files $uri $uri.html $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
